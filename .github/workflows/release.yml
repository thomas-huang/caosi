name: release

on:
  push:
    tags:
      - "v*"

# contents: GitHub Release. id-token: npm Trusted Publishing (OIDC), no access token.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: bash scripts/build_release.sh "${GITHUB_REF_NAME#v}" dist

      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1+. Do not set NODE_AUTH_TOKEN.
      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Publish npm
        working-directory: packaging/npm
        run: |
          cp ../../README.md README.md
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public --provenance
